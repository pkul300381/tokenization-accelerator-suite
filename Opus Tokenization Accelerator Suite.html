<style>
/* Layout concept: a control-room console. A fixed top bar, a wide content column,
   card grids for choices, and dense tables and charts for the service pages.
   Palette: deep navy ink, one blue accent, Opus gold reserved for highlights. */
:root {
  --bg: #f3f6fa;
  --surface: #ffffff;
  --surface-2: #e9eef6;
  --fg: #0f2340;
  --muted: #56667e;
  --line: #d3dcea;
  --accent: #1754a0;
  --accent-fg: #ffffff;
  --gold: #b97d05;
  --good: #1b7647;
  --warn: #9a5b00;
  --bad: #b3261e;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1828;
    --surface: #10233b;
    --surface-2: #16304f;
    --fg: #e6eef8;
    --muted: #9bafc8;
    --line: #26405f;
    --accent: #7db2ee;
    --accent-fg: #0a1828;
    --gold: #f2b233;
    --good: #5fd09a;
    --warn: #f0b04a;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1828;
  --surface: #10233b;
  --surface-2: #16304f;
  --fg: #e6eef8;
  --muted: #9bafc8;
  --line: #26405f;
  --accent: #7db2ee;
  --accent-fg: #0a1828;
  --gold: #f2b233;
  --good: #5fd09a;
  --warn: #f0b04a;
  --bad: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 40px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.caps { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); }
.brand b { font-size: 18px; letter-spacing: 0.04em; color: var(--accent); }
.brand span { font-size: 13px; color: var(--muted); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav a {
  color: var(--muted); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 6px;
}
.nav a[aria-current="page"], .nav a:hover { color: var(--fg); background: var(--surface-2); }
.nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .card-link:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.theme-btn { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

main { max-width: 1200px; margin: 0 auto; padding-top: 28px; min-width: 0; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.lead { font-size: 16px; color: var(--muted); max-width: 70ch; margin-top: 8px; }
.section { margin-top: 36px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

.hero { border-bottom: 1px solid var(--line); padding-bottom: 28px; }
.hero .title-row { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; justify-content: space-between; }

/* cards */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); min-width: 0; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card.live { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.card.dis { opacity: 0.6; }
.card .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card-link { text-decoration: none; color: inherit; }
.card-link:hover .card { border-color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); background: color-mix(in srgb, var(--good) 12%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.pill.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.pill.gold { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, transparent); background: color-mix(in srgb, var(--gold) 12%, transparent); }

.btn {
  font: inherit; font-size: 14px; font-weight: 500; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
}
.btn.ghost { background: none; color: var(--accent); }
.btn.line { background: var(--surface); color: var(--fg); border-color: var(--line); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 13px; }

input[type="text"], input[type="number"], select {
  font: inherit; font-size: 14px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.toolbar > * { min-width: 0; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--fg); }

/* stepper */
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 18px 0 22px; }
.step {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  font: inherit; text-align: left; color: var(--muted); cursor: pointer; min-width: 0;
}
.step b { display: block; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
.step span { font-size: 13px; color: var(--fg); overflow-wrap: anywhere; }
.step[aria-current="step"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.step[data-done="1"] b { color: var(--good); }
.step:disabled { cursor: default; opacity: 0.55; }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-width: 100%; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; background: var(--surface-2); }
table.data tr:last-child td { border-bottom: 0; }
table.data td.r, table.data th.r { text-align: right; }
.hash { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; min-width: 0; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } .stepper { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

pre.code {
  margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.55; max-width: 100%;
}
.notice {
  border: 1px solid color-mix(in srgb, var(--gold) 55%, var(--line));
  background: color-mix(in srgb, var(--gold) 9%, var(--surface));
  border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--fg);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 13px; background: var(--surface); color: var(--muted); border: 0; padding: 7px 12px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.progress { display: flex; flex-direction: column; gap: 8px; }
.prog-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); justify-self: center; }
.dot.run { border-color: var(--accent); border-top-color: transparent; animation: spin 0.9s linear infinite; }
.dot.ok { background: var(--good); border-color: var(--good); }

@media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }

#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px);

.foot { margin-top: 48px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

  function lineChart(points) {

      }).join('') : '<tr><td colspan="10" class="muted">No transactions match these filters.</td></tr>') +

    var pager = '<div class="toolbar" style="justify-content:space-between;margin-top:10px"><span class="small muted num">Showing ' + (rows.length ? a.page * TX_PAGE + 1 : 0) + '-' + Math.min(rows.length, a.page * TX_PAGE + TX_PAGE) + ' of ' + rows.length + '</span>' +
      '<div class="toolbar"><button class="btn line sm" type="button" data-act="apage" data-v="-1"' + (a.page === 0 ? ' disabled' : '') + '>Previous</button><span class="small num">Page ' + (a.page + 1) + ' of ' + pages + '</span><button class="btn line sm" type="button" data-act="apage" data-v="1"' + (a.page >= pages - 1 ? ' disabled' : '') + '>Next</button></div></div>';
    var csv = a.showCsv ? '<div class="panel" style="margin-top:14px"><div class="toolbar" style="justify-content:space-between"><h3>CSV export</h3><button class="btn ghost sm" type="button" data-act="hidecsv">Close</button></div><p class="small muted" style="margin:6px 0">Clipboard access is blocked here. Select the text below and copy it.</p><textarea readonly rows="8" style="width:100%;font-family:var(--mono);font-size:12px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px">' + esc(toCsv(rows)) + '</textarea></div>' : '';
    return '' +
      '<div class="crumbs"><a href="#/">Suite</a> / Audit and Reporting Service</div>' +
      '<div class="caps">Integrated service infrastructure</div>' +
      '<h1 style="margin-top:6px">Audit and Reporting</h1>' +
      '<p class="lead">A tamper-evident log of every stablecoin transaction, with compliance outcomes. Filter it, check the daily pattern, and export the rows you need.</p>' +
      '<div class="toolbar" style="margin:22px 0 16px">' +
      '<label class="field">Period<select data-input="arange"><option value="7"' + (a.range === 7 ? ' selected' : '') + '>Last 7 days</option><option value="30"' + (a.range === 30 ? ' selected' : '') + '>Last 30 days</option></select></label>' +
      '<label class="field">Status<select data-input="astatus">' + ['all', 'Confirmed', 'Pending', 'Failed'].map(function (x) { return '<option value="' + x + '"' + (a.status === x ? ' selected' : '') + '>' + (x === 'all' ? 'All statuses' : x) + '</option>'; }).join('') + '</select></label>' +
      '<label class="field">Chain<select data-input="achain"><option value="all">All chains</option>' + CHAINS.filter(function (c) { return TX_CHAINS.indexOf(c.id) >= 0; }).map(function (c) { return '<option value="' + c.id + '"' + (a.chain === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="field">Type<select data-input="atype"><option value="all">All types</option>' + TYPES.map(function (x) { return '<option' + (a.type === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></label>' +
      '<button class="btn" type="button" data-act="copycsv">Copy CSV</button>' +
      '</div>' +
      '<div class="kpis">' +
      '<div class="kpi"><div class="caps">Volume</div><div class="v">' + usdCompact(vol) + '</div></div>' +
      '<div class="kpi"><div class="caps">Transactions</div><div class="v num">' + num(rows.length) + '</div></div>' +
      '<div class="kpi"><div class="caps">Confirmed rate</div><div class="v num">' + (rate * 100).toFixed(1) + '%</div></div>' +
      '<div class="kpi"><div class="caps">Needs review or blocked</div><div class="v num" style="color:' + (flagged ? 'var(--warn)' : 'var(--good)') + '">' + num(flagged) + '</div></div></div>' +
      '<section class="section split"><div class="panel"><div class="section-head" style="margin-bottom:6px"><div><div class="caps">Daily volume</div><h2>USD millions per day</h2></div></div>' + dailyChart(rows, a.range) + '</div>' +
      '<div class="panel"><h2>Compliance outcomes</h2>' + complianceList(rows) + '</div></section>' +
      '<section class="section"><div class="section-head"><div><div class="caps">Transaction log</div><h2>Ledger entries</h2></div></div>' + table + pager + csv + '</section>';
  }
  function dailyChart(rows, days) {
    var buckets = [], i;
    for (i = 0; i < days; i++) buckets.push(0);
    rows.forEach(function (t) {
      var idx = days - 1 - Math.floor((NOW - t.ts) / DAY);
      if (idx >= 0 && idx < days) buckets[idx] += t.amount / 1e6;
    });
    var W = 560, H = 200, pl = 36, pb = 24, pt = 10, pr = 8;
    var max = Math.max.apply(null, buckets.concat([1]));
    var bw = (W - pl - pr) / days;
    var bars = buckets.map(function (v, k) {
      var h = (v / max) * (H - pb - pt);
      return '<rect x="' + (pl + k * bw + 1).toFixed(1) + '" y="' + (H - pb - h).toFixed(1) + '" width="' + Math.max(2, bw - 2).toFixed(1) + '" height="' + h.toFixed(1) + '" fill="var(--accent)" fill-opacity="0.85" rx="2"/>';
    }).join('');
    var grid = [0, 0.5, 1].map(function (t) {
      var y = pt + (1 - t) * (H - pb - pt);
      return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + (max * t).toFixed(0) + '</text>';
    }).join('');
    var first = new Date(NOW - (days - 1) * DAY).toISOString().slice(5, 10);
    var lastD = new Date(NOW).toISOString().slice(5, 10);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Daily transaction volume">' + grid + bars +
      '<text x="' + pl + '" y="' + (H - 6) + '">' + first + '</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">' + lastD + '</text></svg>';
  }
  function complianceList(rows) {
    var c = { Pass: 0, Review: 0, Blocked: 0 };
    rows.forEach(function (t) { c[t.compliance]++; });
    var total = rows.length || 1;
    function bar(label, n, cls) {
      return '<div style="margin:10px 0"><div class="toolbar" style="justify-content:space-between;gap:8px"><span>' + label + '</span><span class="num muted">' + n + ' · ' + ((n / total) * 100).toFixed(1) + '%</span></div>' +
        '<div style="height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden"><div style="height:100%;width:' + ((n / total) * 100).toFixed(1) + '%;background:var(--' + cls + ')"></div></div></div>';
    }
    return bar('Pass, auto-approved', c.Pass, 'good') + bar('Review by risk desk', c.Review, 'warn') + bar('Blocked by policy', c.Blocked, 'bad') +
      '<p class="small muted" style="margin-top:12px">Outcomes come from the simulated risk engine. Every row keeps its hash, so an auditor can match the log to the ledger.</p>';
  }
  function toCsv(rows) {
    var head = ['id', 'timestamp_utc', 'type', 'stablecoin', 'chain', 'wallet', 'amount_usd', 'status', 'compliance', 'hash'];
    var lines = [head.join(',')];
    rows.forEach(function (t) {
      lines.push([t.id, new Date(t.ts).toISOString(), t.type, t.coin, t.chain.name, t.wallet, t.amount, t.status, t.compliance, t.hash].map(function (v) {
        var s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(','));
    });
    return lines.join('\n');
  }

  /* ---------- events (delegated) ---------- */
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');

    var act = el.dataset.act, v = el.dataset.v;
    var w = S.wiz;
    if (act === 'goto') { w.step = Number(el.dataset.n); render(); }
    else if (act === 'next') { w.step = Math.min(5, w.step + 1); render(); }
    else if (act === 'back') { w.step = Math.max(1, w.step - 1); render(); }
    else if (act === 'reset') { S.wiz = { step: 1, coin: null, provider: null, chain: null, wallets: [], chainTab: 'public', deploy: null, deployed: false, monthlyTx: 5000 }; render(); }
    else if (act === 'coin') { if (w.coin !== v) { w.coin = v; w.provider = null; w.chain = null; w.wallets = []; } render(); }
    else if (act === 'prov') { if (w.provider !== v) { w.provider = v; w.chain = null; w.wallets = []; } render(); }
    else if (act === 'ctab') { w.chainTab = v; render(); }
    else if (act === 'chain') { if (w.chain !== v) { w.chain = v; w.wallets = []; } render(); }
    else if (act === 'wallet') { var i = w.wallets.indexOf(v); if (i >= 0) w.wallets.splice(i, 1); else w.wallets.push(v); render(); }
    else if (act === 'deploy') { runDeploy(); }
    else if (act === 'wregister') { registerWallet(); }
    else if (act === 'wtest') { testWallet(Number(v), el); }
    else if (act === 'wremove') { S.wallet.registered.splice(Number(v), 1); render(); }
    else if (act === 'mmdetect') { mmDetect(); render(); }
    else if (act === 'mmconnect') { mmConnect(); }
    else if (act === 'mmswitch') { mmSwitch(); }
    else if (act === 'mmsign') { mmSign(); }
    else if (act === 'mmforget') { S.wallet.mm = { account: null, chainId: null, signature: null, message: null, signedAt: null, error: null }; render(); toast('Cleared here. Revoke this site in MetaMask settings to disconnect fully.'); }
    else if (act === 'fxdir') { S.fx.dir = v; render(); }
    else if (act === 'fxrefresh') { S.fx.quoteAt = Date.now(); var q = document.getElementById('fx-quote'); if (q) q.innerHTML = fxQuoteHtml(); toast('Quote refreshed'); }
    else if (act === 'gview') { S.gas.admin = v === 'admin'; render(); }
    else if (act === 'apage') { S.audit.page += Number(v); render(); }
    else if (act === 'copycsv') { copyCsv(); }
    else if (act === 'hidecsv') { S.audit.showCsv = false; render(); }
  });

  app.addEventListener('input', function (e) {
    var t = e.target, k = t.dataset.input;
    if (!k) return;
    if (k === 'monthly') { S.wiz.monthlyTx = Math.max(100, Number(t.value) || 100); render(); }
    else if (k === 'limit') { S.wallet.limit = Number(t.value) || 0; }
    else if (k === 'fxamt') { S.fx.amount = Number(t.value) || 0; var q = document.getElementById('fx-quote'); if (q) q.innerHTML = fxQuoteHtml(); }
    else if (k === 'gvol') { S.gas.volume = Number(t.value); updateGas(); }
    else if (k === 'gcong') { S.gas.congestion = Number(t.value); updateGas(); }

  });

  app.addEventListener('change', function (e) {
    var t = e.target, k = t.dataset.input;
    if (!k) return;
    if (k === 'wallet') { S.wallet.wallet = t.value; S.wallet.chains = S.wallet.chains.filter(function (c) { return walletById(t.value).chains.indexOf(c) >= 0; }); if (!S.wallet.chains.length) S.wallet.chains = [walletById(t.value).chains[0]]; render(); }

    else if (k === 'gchain') { S.gas.chain = t.value; render(); }
    else if (k === 'gtype') { S.gas.type = t.value; render(); }
    else if (k === 'arange') { S.audit.range = Number(t.value); S.audit.page = 0; render(); }
    else if (k === 'astatus') { S.audit.status = t.value; S.audit.page = 0; render(); }

  function updateGas() {

  function registerWallet() {
    var s = S.wallet;
    if (!s.chains.length) return;
    var w = walletById(s.wallet);
    var label = w.name;
    if (w.id === 'metamask') {
      var m = s.mm;
      if (!m.account || !m.signature) { toast('Connect MetaMask and sign the ownership message first'); return; }
      if (m.chainId !== MM_CHAIN_IDS[s.chains[0]]) { toast('Switch MetaMask to ' + chainById(s.chains[0]).name + ' first'); return; }
      label = w.name + ' · ' + mmShort(m.account);
    }
    var entry = { wallet: label, chain: s.chains[0], status: 'Pending verification', since: '2026-10-16' };
    s.registered.unshift(entry);
    render();
    setTimeout(function () {
      if (S.wallet.registered.indexOf(entry) >= 0) {
        entry.status = s.dual && s.limit > 500000 ? 'Active, dual approval' : 'Active';

        toast('Wallet verified: ' + entry.wallet);

    }, 2200);
    toast('Registering ' + w.name + ' on ' + chainById(entry.chain).name);
  }
  function testWallet(i, el) {
    var r = S.wallet.registered[i];
    if (!r) return;
    if (r.wallet.indexOf('MetaMask') === 0) {
      var p = mmDetect();
      if (!p || !S.wallet.mm.account) { toast('Connect MetaMask to run a live check'); return; }
      p.request({ method: 'eth_chainId' })
        .then(function (cid) { toast('MetaMask reachable on ' + mmChainLabel(cid)); })
        .catch(function (err) { toast(mmError(err, 'MetaMask check failed')); });
      return;
    }
    var ms = 80 + Math.floor(Math.random() * 320);
    toast('Simulated test: ' + r.wallet + ' answered in ' + ms + ' ms');
  }

  /* ---------- MetaMask: discovery, connect, network switch, ownership signature ---------- */
  // Read and sign only. This code never calls eth_sendTransaction and never receives key material.
  var MM = { provider: null, bound: false };
  var MM_CHAIN_IDS = { ethereum: '0x1', base: '0x2105', arbitrum: '0xa4b1', polygon: '0x89', avalanche: '0xa86a' };
  function mmChainLabel(cid) {
    if (!cid) return 'Unknown network';
    for (var k in MM_CHAIN_IDS) if (MM_CHAIN_IDS[k] === cid) return chainById(k).name + ' (' + cid + ')';
    return 'Chain ' + parseInt(cid, 16) + ' (' + cid + ')';
  }
  function mmShort(a) { return a ? a.slice(0, 6) + '...' + a.slice(-4) : ''; }
  function mmError(err, prefix) {
    if (err && err.code === 4001) return 'Request rejected in MetaMask.';
    if (err && err.code === -32002) return 'A MetaMask request is already pending. Open the MetaMask window to respond.';
    return prefix + ': ' + (err && err.message ? err.message : 'unknown error');
  }
  function mmDetect() {
    if (!MM.provider && window.ethereum && window.ethereum.isMetaMask) MM.provider = window.ethereum;
    return MM.provider;
  }
  function mmBind() {
    var p = MM.provider;
    if (MM.bound || !p || typeof p.on !== 'function') return;
    MM.bound = true;
    p.on('accountsChanged', function (accts) {
      S.wallet.mm.account = (accts && accts[0]) || null;
      S.wallet.mm.signature = null;
      if (route().name === 'wallet') render();
    });
    p.on('chainChanged', function (cid) {
      S.wallet.mm.chainId = cid;
      if (route().name === 'wallet') render();
    });
  }
  window.addEventListener('eip6963:announceProvider', function (e) {
    var d = e.detail;
    if (d && d.info && d.info.rdns === 'io.metamask' && !MM.provider) {
      MM.provider = d.provider;
      mmBind();
      if (route().name === 'wallet') render();
    }
  });
  window.dispatchEvent(new Event('eip6963:requestProvider'));

  function mmConnect() {
    var p = mmDetect();
    if (!p) { S.wallet.mm.error = 'MetaMask was not detected in this browser.'; render(); return; }
    mmBind();
    p.request({ method: 'eth_requestAccounts' })
      .then(function (accts) {
        return p.request({ method: 'eth_chainId' }).then(function (cid) {
          S.wallet.mm = { account: accts[0] || null, chainId: cid, signature: null, message: null, signedAt: null, error: null };
          render();
          toast('MetaMask connected');
        });
      })
      .catch(function (err) { S.wallet.mm.error = mmError(err, 'Could not connect'); render(); });
  }
  function mmSwitch() {
    var p = mmDetect();
    var target = S.wallet.chains[0];
    if (!p || !target || !MM_CHAIN_IDS[target]) { S.wallet.mm.error = 'Choose an EVM chain that MetaMask supports first.'; render(); return; }
    p.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: MM_CHAIN_IDS[target] }] })
      .then(function () { return p.request({ method: 'eth_chainId' }); })
      .then(function (cid) { S.wallet.mm.chainId = cid; S.wallet.mm.error = null; render(); toast('MetaMask switched network'); })
      .catch(function (err) {
        S.wallet.mm.error = err && err.code === 4902
          ? 'This network is not added in MetaMask yet. Add it in MetaMask, then try again.'
          : mmError(err, 'Switch failed');
        render();
      });
  }
  function mmSign() {
    var p = mmDetect();
    var acct = S.wallet.mm.account;
    if (!p || !acct) return;
    var target = S.wallet.chains[0] ? chainById(S.wallet.chains[0]).name : 'Not selected';
    var msg = 'Opus Tokenization Accelerator Suite\nWallet ownership check. This is a signature only; no transaction is sent.\n' +
      'Address: ' + acct + '\nTarget network: ' + target +
      '\nNonce: ' + Math.random().toString(36).slice(2, 12) + '\nIssued: ' + new Date().toISOString();
    // The message is ASCII only, so one byte per character is exact.
    var hex = '0x' + Array.prototype.map.call(msg, function (c) { return ('0' + c.charCodeAt(0).toString(16)).slice(-2); }).join('');
    p.request({ method: 'personal_sign', params: [hex, acct] })
      .then(function (sig) {
        S.wallet.mm.signature = sig;
        S.wallet.mm.message = msg;
        S.wallet.mm.signedAt = new Date().toISOString();
        S.wallet.mm.error = null;
        render();
        toast('Ownership signature received');
      })
      .catch(function (err) { S.wallet.mm.error = mmError(err, 'Signing failed'); render(); });
  }
  function mmPanel() {
    var m = S.wallet.mm, p = mmDetect();
    var target = S.wallet.chains[0] ? chainById(S.wallet.chains[0]) : null;
    var targetIsEvm = !!(target && MM_CHAIN_IDS[target.id]);
    var onTarget = targetIsEvm && m.chainId === MM_CHAIN_IDS[target.id];
    var h = '<section class="panel"><div class="caps">Self-custody · MetaMask</div><h2>Connect your MetaMask wallet</h2>' +
      '<p class="small muted" style="margin:6px 0 12px">This connects your own wallet for ownership checks. The app reads your address and asks you to sign a short message. It never sends a transaction and never sees your keys.</p>';
    if (!p) {
      h += '<p class="muted">MetaMask was not detected in this browser.</p>' +
        '<div class="toolbar" style="gap:8px"><button class="btn line sm" type="button" data-act="mmdetect">Check again</button> ' +
        '<a class="btn ghost sm" href="https://metamask.io/download/" target="_blank" rel="noopener">Get MetaMask</a></div>';
    } else if (!m.account) {
      h += '<button class="btn" type="button" data-act="mmconnect">Connect MetaMask</button>';
    } else {
      h += '<div class="tbl"><table class="data"><tbody>' +
        '<tr><td>Account</td><td class="num" title="' + esc(m.account) + '">' + esc(mmShort(m.account)) + '</td></tr>' +
        '<tr><td>Network</td><td class="num">' + esc(mmChainLabel(m.chainId)) + '</td></tr>' +
        '<tr><td>Target network</td><td>' + (target ? esc(target.name) : 'Select a chain in the wallet steps') + '</td></tr>' +
        '</tbody></table></div>';
      if (target && !targetIsEvm) {
        h += '<p class="small" style="margin:10px 0"><span class="pill warn">EVM only</span> MetaMask supports EVM networks. ' + esc(target.name) + ' needs a different wallet type.</p>';
      } else if (target && !onTarget) {
        h += '<p class="small" style="margin:10px 0"><span class="pill warn">Network mismatch</span> Switch MetaMask to ' + esc(target.name) + ' before registering.</p>' +
          '<button class="btn line sm" type="button" data-act="mmswitch">Switch to ' + esc(target.name) + '</button>';
      }
      h += '<div class="toolbar" style="gap:8px;margin-top:12px">' +
        (m.signature ? '<span class="pill good">Ownership signed</span>' : '<button class="btn" type="button" data-act="mmsign">Sign ownership message</button>') +
        ' <button class="btn ghost sm" type="button" data-act="mmforget">Forget connection</button></div>';
      if (m.signature) h += '<p class="small muted" style="margin-top:10px">Signed ' + esc(m.signedAt) + '. Server-side signature verification is not connected in this simulated app.</p>';
    }
    if (m.error) h += '<p role="alert" class="small" style="margin-top:10px;color:var(--bad)">' + esc(m.error) + '</p>';
    return h + '</section>';
  }

  function runDeploy() {
    var w = S.wiz;
    if (w.deploy && w.deploy.done < 6) return;
    w.deploy = { current: 0, done: 0 };
    render();
    var i = 0;
    var t = setInterval(function () {
      i++;
      if (!S.wiz.deploy) { clearInterval(t); return; }
      S.wiz.deploy.done = i;
      S.wiz.deploy.current = i;
      if (route().name !== 'stablecoin') { clearInterval(t); return; }
      if (i >= 6) { clearInterval(t); S.wiz.deployed = true; S.wiz.deploy.current = -1; }
      render();
    }, 900);
  }

  function copyCsv() {
    var rows = txFiltered();
    var csv = toCsv(rows);
    var fallback = function () { S.audit.showCsv = true; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(function () { toast('Copied ' + rows.length + ' rows as CSV'); }, fallback);
    } else { fallback(); }
  }

  window.addEventListener('hashchange', render);

  /* ---------- theme toggle ---------- */
  var themes = ['system', 'dark', 'light'];
  var tIdx = 0;
  var tBtn = document.getElementById('theme-btn');
  tBtn.addEventListener('click', function () {
    tIdx = (tIdx + 1) % themes.length;
    var t = themes[tIdx];
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    tBtn.textContent = 'Theme: ' + (t === 'system' ? 'System' : t === 'dark' ? 'Dark' : 'Light');
  });

  render();
})();
</script>

</body></html>
