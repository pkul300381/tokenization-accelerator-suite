services:
  apisix:
    image: opus-token-gateway:0.1.0
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:9080"
    environment:
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:?Set OIDC_DISCOVERY_URL}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
